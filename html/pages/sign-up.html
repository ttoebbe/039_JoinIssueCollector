<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PFG Issue Collector · Registrieren</title>
    <link rel="icon" href="/assets/logos/pfg-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/css/core/tokens.css" />
    <link rel="stylesheet" href="/css/core/variables.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/pages/sign.css" />
    <link rel="stylesheet" href="/css/pages/auth-common.css" />
    <script src="/js/core/constants.js"></script>
    <script src="/js/core/data-utils.js"></script>
    <script src="/js/core/ui-utils.js"></script>
    <script src="/js/core/confirm-overlay.js"></script>
    <script src="/js/core/toast.js"></script>
    <script src="/js/core/auth-service.js"></script>
    <script src="/js/core/firebase-service.js"></script>
    <script src="/js/templates/auth-templates.js"></script>
    <script src="/js/features/auth/auth-validation.js"></script>
    <script src="/js/features/auth/auth-users.js"></script>
    <script src="/js/features/auth/auth-password.js"></script>
    <script src="/js/features/auth/auth-login.js"></script>
    <script src="/js/features/auth/auth-signup.js"></script>
    <script src="/js/features/auth/auth.js"></script>
  </head>

  <body class="auth-page">
    <div class="wrapper max-width-1440">
      <img
        src="/assets/img/homepage-join.svg"
        alt=""
        class="homepage-image"
        id="img-animation"
      />
      <main>
        <section>
          <a href="/html/pages/login.html">
            <img
              src="/assets/icons/arrow-left.svg"
              alt=""
              class="form-decoration-top-left"
            />
          </a>
          <div class="form-header">
            <h1>Registrieren</h1>
            <div class="underline-div"></div>
          </div>
          <form id="sign-up-form" novalidate>
            <div class="input-fields" id="sign-up-fields"></div>
            <label>
              <input type="checkbox" id="sign-up-policy" name="terms" />
              Ich akzeptiere die
              <a href="privacy-policy.html" class="footer-left label-link"
                >Datenschutzerklärung</a
              >
            </label>
            <div class="field-error" id="sign-up-policy-error"></div>
            <div class="form-buttons">
              <button disabled type="submit" class="btn-left" id="sign-up-button">
                Registrieren
              </button>
            </div>
          </form>
        </section>
      </main>
      <footer>
        <a href="privacy-policy.html" class="footer-left">Datenschutzerklärung</a>
        <a href="legal-notice.html" class="footer-right">Impressum</a>
      </footer>
    </div>
    <div id="success-overlay" class="overlay">
      <div class="overlay-content">
        <h2>Ihre Registrierung war erfolgreich.</h2>
      </div>
    </div>
  </body>
</html>

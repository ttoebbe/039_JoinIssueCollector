<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFG Issue Collector · Anmelden</title>

    <link rel="shortcut icon" href="/assets/img/homepage-join.svg" type="image/x-icon">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/css/core/tokens.css">
    <link rel="stylesheet" href="/css/core/variables.css">
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/pages/login.css">
    <link rel="stylesheet" href="/css/pages/auth-common.css">
    <script src="/js/core/constants.js"></script>
    <script src="/js/core/data-utils.js"></script>
    <script src="/js/core/ui-utils.js"></script>
    <script src="/js/core/confirm-overlay.js"></script>
    <script src="/js/core/toast.js"></script>
    <script src="/js/core/auth-service.js"></script>
    <script src="/js/core/firebase-service.js"></script>
    <script src="/js/templates/auth-templates.js"></script>
    <script src="/js/features/auth/auth-validation.js"></script>
    <script src="/js/features/auth/auth-users.js"></script>
    <script src="/js/features/auth/auth-password.js"></script>
    <script src="/js/features/auth/auth-login.js"></script>
    <script src="/js/features/auth/auth-signup.js"></script>
    <script src="/js/features/auth/auth.js"></script>
</head>

<body class="login-page auth-page">
    <div class="wrapper max-width-1440">
        <div class="background-overlay" id="bg"></div>
        <a href="/html/pages/login.html"><img src="/assets/img/homepage-join.svg" alt="" class="homepage-image" id="img-animation">
        </a>
        <header>
            <p>Noch kein Konto? </p>
            <a href="/html/pages/sign-up.html" class="btn-signup">Registrieren</a>
        </header>

        <main>
            <section>
                <div class="form-header">
                    <h1>Anmelden</h1>
                    <div class="underline-div"></div>
                </div>
                <form id="login-form" novalidate>
                    <div class="input-fields">
                        <div class="input-field-wrapper">
                            <div class="input-control">
                                <input type="email" id="email" name="email" placeholder="E-Mail" autocomplete="email">
                                <img src="/assets/img/icons/mail.svg" class="input-icon-email" alt="">
                            </div>
                            <div class="field-error" id="email-error"></div>
                        </div>

                        <div class="input-field-wrapper">
                            <div class="input-control">
                                <input type="password" id="password" name="password" placeholder="Passwort" autocomplete="current-password">
                                <!-- Lock icon, always visible -->
                                <img src="/assets/img/icons/lock.svg" class="input-icon-password" id="password-lock-icon" alt="">
                                <!-- Eye icon toggles visibility -->
                                <img src="/assets/img/icons/visibility_off.svg" class="input-icon-password d-none"
                                    id="password-visibility-toggle" alt="Passwort anzeigen oder verbergen">
                            </div>
                            <div class="field-error" id="password-error"></div>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-left" id="login-button">Anmelden</button>
                        <button class="btn-right" id="guest-login-button">Als Gast anmelden</button>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <a href="/html/pages/privacy-policy.html" class="footer-left">Datenschutzerklärung</a>
            <a href="/html/pages/legal-notice.html" class="footer-right">Impressum</a>
        </footer>
    </div>
</body>

</html>

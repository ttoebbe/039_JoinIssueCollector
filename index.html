<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Issue Collector — Welcome</title>
  <meta name="description" content="Pick your role: create a feature request as a stakeholder, or log in as a team member.">
  <link rel="icon" href="/assets/logos/join-logo-dark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/css/core/tokens.css">
  <link rel="stylesheet" href="/css/landing/base.css">
  <link rel="stylesheet" href="/css/landing/components.css">
  <link rel="stylesheet" href="/css/landing/pages.css">
</head>
<body>
  <main class="welcome-page">
    <div class="welcome-page__splash" aria-hidden="true"></div>
    <img class="welcome-page__logo" src="/assets/logos/join-logo-splash.svg"
         alt="" width="64" height="78">
    <div class="welcome-page__content">
      <p class="welcome-page__signup">
        <span>Not a Join user?</span>
        <a href="/html/pages/sign-up.html" class="text-button text-button--on-dark" data-label="Sign up">Sign up</a>
      </p>

      <section class="welcome-card" aria-labelledby="welcome-title">
        <div class="welcome-card__intro">
          <h1 class="welcome-card__title" id="welcome-title">
            Welcome
            <hr class="welcome-card__rule">
          </h1>
          <p class="welcome-card__lead">
            Pick the option that suits your role: create a request as a stakeholder
            or log in if you’re part of the team.
          </p>
        </div>

        <div class="welcome-card__options">
          <div class="role-option">
            <p class="role-option__prompt">
              <img src="/assets/icons/stakeholder-work.svg" alt="">
              Are you a stakeholder?
            </p>
            <a class="button button--role" href="/html/pages/request.html">Create request</a>
          </div>

          <div class="role-option">
            <p class="role-option__prompt">
              <img src="/assets/icons/team-member.svg" alt="">
              Are you a team member?
            </p>
            <a class="button button--role-secondary" href="/html/pages/login.html">Member log in</a>
          </div>
        </div>
      </section>
    </div>

    <nav class="welcome-page__footer" aria-label="Legal">
      <a class="text-button text-button--on-dark" href="/html/pages/privacy-policy.html" data-label="Privacy Policy">Privacy Policy</a>
      <a class="text-button text-button--on-dark" href="/html/pages/legal-notice.html" data-label="Legal notice">Legal notice</a>
    </nav>
  </main>
</body>
</html>

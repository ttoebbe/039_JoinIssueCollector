# Measures every page in seven viewports and fails on horizontal overflow,
# elements leaving their parent, overlapping stacked siblings or a missing
# gutter. Tooling and rules: tools/layout-check/README.md.
#
# Deliberately separate from deploy-frontend.yml: that one stays manual, this
# one reports on every push to main without deploying anything.

name: Layout check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: Measure layout invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/layout-check/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          pip install -r tools/layout-check/requirements.txt
          python -m playwright install --with-deps chromium

      # The report goes to the job summary as well, so a red run shows the
      # table without opening the log.
      - name: Run the layout check
        run: python tools/layout-check/check_layout.py --json layout-violations.json

      - name: Keep the raw violations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-violations
          path: layout-violations.json
